<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бэкенд-Чат</title>
    
    <style>
        :root {
            --bg-darker: #1e1f22;
            --bg-main: #2b2d31;
            --bg-sidebar: #2b2d31;
            --bg-input: #383a40;
            --text-color: #f2f3f5;
            --text-muted: #949ba4;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --danger-color: #f23f43;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-darker);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Главный контейнер */
        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Левая панель: Каналы и Профиль */
        .sidebar-left {
            width: 240px;
            background-color: var(--bg-darker);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #111214;
        }

        .brand-header {
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #111214;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .channels-space {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .channel-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 8px 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            margin-bottom: 2px;
            transition: background 0.2s, color 0.2s;
        }

        .channel-btn:hover {
            background-color: #35373c;
            color: var(--text-color);
        }

        .channel-btn.active {
            background-color: #404249;
            color: #fff;
            font-weight: 500;
        }

        .channel-btn span {
            margin-right: 6px;
            color: var(--text-muted);
            font-weight: bold;
        }

        /* Нижний блок профиля */
        .user-footer {
            height: 52px;
            background-color: #232428;
            display: flex;
            align-items: center;
            padding: 0 8px;
            justify-content: space-between;
        }

        .user-info-block {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            flex: 1;
        }

        .user-info-block:hover {
            background-color: #35373c;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            position: relative;
            flex-shrink: 0;
        }

        .status-online {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            background-color: #23a55a;
            border-radius: 50%;
            border: 2px solid #232428;
        }

        .user-names {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .display-name-txt {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-tag-txt {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .settings-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:hover {
            color: var(--text-color);
            background-color: #35373c;
        }

        /* Центральная зона чата */
        .chat-area {
            flex: 1;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #1f2023;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .channel-title {
            font-weight: 600;
            font-size: 16px;
        }

        .search-box {
            background-color: var(--bg-darker);
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
            outline: none;
            width: 180px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Стили сообщений */
        .message {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .msg-body {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .msg-display-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .msg-username {
            font-size: 11px;
            color: var(--text-muted);
        }

        .msg-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .msg-content {
            font-size: 15px;
            color: #dbdee1;
            word-break: break-word;
            line-height: 1.4;
        }

        .media-attachment {
            max-width: 400px;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 6px;
            border: 1px solid #1f2023;
        }

        /* Поле ввода сообщений */
        .input-area {
            padding: 0 16px 24px 16px;
            background-color: var(--bg-main);
        }

        .input-wrapper {
            background-color: var(--bg-input);
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            height: 44px;
        }

        .attach-btn-label {
            color: var(--text-muted);
            cursor: pointer;
            margin-right: 12px;
            font-size: 20px;
            display: flex;
            align-items: center;
        }

        .attach-btn-label:hover {
            color: var(--text-color);
        }

        .main-chat-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            height: 100%;
        }

        /* Правая панель: Список участников */
        .sidebar-right {
            width: 240px;
            background-color: var(--bg-darker);
            border-left: 1px solid #111214;
            display: flex;
            flex-direction: column;
            padding: 16px 8px;
        }

        .members-title {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-left: 8px;
            letter-spacing: 0.5px;
        }

        .members-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        .mem-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 8px;
            border-radius: 4px;
        }

        /* Модалка настроек профиля */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal-card {
            background-color: var(--bg-main);
            width: 440px;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-card h3 {
            font-size: 20px;
            font-weight: 600;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
        }

        .form-group input[type="text"] {
            background-color: var(--bg-darker);
            border: 1px solid #1e1f22;
            padding: 10px;
            border-radius: 4px;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 4px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-primary:hover { background-color: var(--accent-hover); }

        .btn-link {
            background: none;
            color: #fff;
        }

        .btn-link:hover { text-decoration: underline; }

        /* Оповещение об ошибке сети */
        .db-error-alert {
            background-color: rgba(242, 63, 67, 0.1);
            border: 1px solid var(--danger-color);
            color: #ff999b;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin: 8px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar-left">
            <div class="brand-header">Bogdan Chat Space</div>
            
            <div class="channels-space" id="channelsList">
                <div style="color: var(--text-muted); padding: 8px; font-size:14px;">Запуск бэкенда...</div>
            </div>

            <div class="user-footer">
                <div class="user-info-block" onclick="toggleModal(true)">
                    <div class="avatar" id="myAvatar">??</div>
                    <div class="user-names">
                        <span class="display-name-txt" id="myDispName">Загрузка...</span>
                        <span class="user-tag-txt" id="myUserTag">@user</span>
                    </div>
                </div>
                <button class="settings-btn" onclick="toggleModal(true)" title="Настройки профиля">
                    ⚙️
                </button>
            </div>
        </aside>

        <main class="chat-area">
            <div class="chat-header">
                <div class="channel-title" id="currentChannelName"># выберите-канал</div>
                <input type="text" class="search-box" id="searchNickInput" placeholder="Поиск по нику..." oninput= "filterMessagesByNick()">
            </div>

            <div class="messages-container" id="messagesList">
                <div style="color: var(--text-muted); text-align:center; margin-top:40px;">Выберите канал слева для начала общения.</div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="file" id="mediaFileInput" accept="image/*,video/*" style="display:none;" onchange="uploadMedia(this)">
                    <label for="mediaFileInput" class="attach-btn-label" title="Прикрепить фото/видео">+</label>
                    
                    <input type="text" class="main-chat-input" id="msgInput" placeholder="Написать в чат..." onkeydown="if(event.key === 'Enter') sendMessage()">
                </div>
            </div>
        </main>

        <aside class="sidebar-right">
            <div class="members-title">В сети — <span id="onlineCount">0</span></div>
            <div class="members-list" id="membersContainer">
                </div>
        </aside>

    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <h3>Настройки профиля</h3>
            
            <div class="form-group">
                <label>Никнейм в чате (Отображаемое имя)</label>
                <input type="text" id="inputDispName" placeholder="Например: Богдан">
            </div>

            <div class="form-group">
                <label>Системный тег (Уникальный @ID)</label>
                <input type="text" id="inputUserTag" placeholder="Например: frogetttt">
            </div>

            <div class="form-group">
                <label>Сменить аватарку</label>
                <input type="file" id="avatarInput" accept="image/*">
            </div>

            <div class="modal-buttons">
                <button class="btn btn-link" onclick="toggleModal(false)">Отмена</button>
                <button class="btn btn-primary" onclick="saveProfile()">Сохранить изменения</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <script>
        // 1. АНТИБЛОКИРОВОЧНЫЙ ФИЛЬТР: Проверяем, отдала ли сеть скрипт Supabase
        if (typeof Supabase === 'undefined') {
            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById('currentChannelName').innerText = '❌ Ошибка сети (РКН)';
                document.getElementById('channelsList').innerHTML = `
                    <div class="db-error-alert">
                        <b>Блокировка скриптов базы данных!</b><br>
                        Не удалось подгрузить файлы Supabase из сети.<br><br>
                        <b>Решение:</b><br>
                        Включи средства обхода блокировок (GoodbyeDPI, Zapret или VPN) и перезагрузи страницу.
                    </div>
                `;
            });
            throw new Error("Supabase CDN blocked. Stopping JS execution.");
        }

        // Параметры твоей базы данных
        const SUPABASE_URL = 'https://nfbfynjojzissgriesaf.supabase.co';
        // !!! Не забудь вставить рабочий анон-ключ (начинается на eyJ...) !!!
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mYmZ5bmpvanppc3Nncmllc2FmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjEzMjcsImV4cCI6MjA5NTEzNzMyN30.UllcqfyMCdQLyZWGEsPl4M8g0o3ZDVe4TYRMCwm4i8s'; 
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Инициализация локального профиля юзера
        let myUsername = localStorage.getItem('bg_username') || 'user_' + Math.floor(Math.random() * 10000);
        let myDisplayName = localStorage.getItem('bg_display_name') || 'Пользователь';
        let myAvatarUrl = localStorage.getItem('bg_avatar_url') || '';
        let currentChannelId = null;

        localStorage.setItem('bg_username', myUsername);
        localStorage.setItem('bg_display_name', myDisplayName);

        // Синхронизация данных с таблицей профилей
        async function syncProfileWithDB() {
            try {
                const { error } = await supabase.from('profiles').upsert([{ 
                    username: myUsername, 
                    display_name: myDisplayName, 
                    avatar_url: myAvatarUrl,
                    last_seen: new Date().toISOString()
                }]);
                if (error) console.error("База отклонила апдейт профиля:", error.message);
            } catch (e) {
                console.error("Сбой синхронизации профиля:", e);
            }
        }

        // Рендер аватарки и ников в левом углу
        function updateProfileUI() {
            document.getElementById('myDispName').innerText = myDisplayName;
            document.getElementById('myUserTag').innerText = '@' + myUsername;
            const av = document.getElementById('myAvatar');
            if(myAvatarUrl) {
                av.style.backgroundImage = `url(${myAvatarUrl})`;
                av.innerText = '';
            } else {
                av.style.backgroundImage = 'none';
                av.innerText = myDisplayName.substring(0, 2).toUpperCase();
                av.style.backgroundColor = '#5865f2';
            }
        }

        function toggleModal(show) {
            document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
            if(show) {
                document.getElementById('inputDispName').value = myDisplayName;
                document.getElementById('inputUserTag').value = myUsername;
            }
        }

        // Сохранение изменений в модалке
        async function saveProfile() {
            const newDN = document.getElementById('inputDispName').value.trim();
            const newUN = document.getElementById('inputUserTag').value.trim().replace('@', '').toLowerCase();
            const avFile = document.getElementById('avatarInput').files[0];

            if(!newDN || !newUN) return alert('Заполните все поля!');

            if(avFile) {
                const fileExt = avFile.name.split('.').pop();
                const fileName = `avatars/${newUN}_${Date.now()}.${fileExt}`;
                const { error: uploadError } = await supabase.storage.from('media').upload(fileName, avFile, { upsert: true });
                
                if(!uploadError) {
                    const { data } = supabase.storage.from('media').getPublicUrl(fileName);
                    myAvatarUrl = data.publicUrl;
                    localStorage.setItem('bg_avatar_url', myAvatarUrl);
                }
            }

            if(newUN !== myUsername) {
                localStorage.setItem('bg_username', newUN);
                myUsername = newUN;
            }

            myDisplayName = newDN;
            localStorage.setItem('bg_display_name', myDisplayName);

            updateProfileUI();
            await syncProfileWithDB();
            toggleModal(false);
            trackPresence(); 
        }

        // Загрузка доступных каналов из базы
        async function loadChannels() {
            const container = document.getElementById('channelsList');
            try {
                const { data, error } = await supabase.from('channels').select('*');
                
                if(error) {
                    container.innerHTML = `<div class="db-error-alert">Ошибка таблиц! Проверь права доступа к бэкенду.</div>`;
                    document.getElementById('currentChannelName').innerText = 'Ошибка соединения с Supabase';
                    return;
                }

                if(!data || data.length === 0) {
                    container.innerHTML = `<div style="color:var(--text-muted); padding:8px;">Каналы отсутствуют. Создайте комнату в админ-панели.</div>`;
                    document.getElementById('currentChannelName').innerText = 'База пуста.';
                    return;
                }

                container.innerHTML = '';
                data.forEach((ch, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `channel-btn ${idx === 0 ? 'active' : ''}`;
                    btn.innerHTML = `<span>#</span> ${ch.name}`;
                    btn.onclick = () => switchChannel(ch.id, ch.name, btn);
                    container.appendChild(btn);
                    
                    if(idx === 0) switchChannel(ch.id, ch.name, btn);
                });
            } catch (err) {
                container.innerHTML = `<div class="db-error-alert"><b>Ошибка сети!</b><br>Ваш провайдер блокирует домен базы данных (*.supabase.co). Включите Zapret/VPN.</div>`;
                document.getElementById('currentChannelName').innerText = 'Подключение заблокировано провайдером!';
                console.error(err);
            }
        }

        function switchChannel(id, name, btnElement) {
            currentChannelId = id;
            document.getElementById('currentChannelName').innerText = '# ' + name;
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            
            document.getElementById('searchNickInput').value = '';
            loadMessages();
        }

        // Выгрузка истории сообщений конкретного канала
        async function loadMessages() {
            const list = document.getElementById('messagesList');
            list.innerHTML = '<div style="color:var(--text-muted); text-align:center;">Загрузка истории...</div>';

            try {
                const { data, error } = await supabase
                    .from('messages')
                    .select('*, profiles(display_name, avatar_url)')
                    .eq('channel_id', currentChannelId)
                    .order('created_at', { ascending: true });

                if (error) {
                    // Запасной фоллбек-запрос без джоина профилей, если сломались внешние ключи
                    const { data: fallbackData } = await supabase.from('messages').select('*').eq('channel_id', currentChannelId).order('created_at', { ascending: true });
                    list.innerHTML = '';
                    if(fallbackData) fallbackData.forEach(renderMessage);
                    return;
                }

                list.innerHTML = '';
                if(data && data.length > 0) {
                    data.forEach(renderMessage);
                } else {
                    list.innerHTML = '<div style="color: var(--text-muted); text-align:center; margin-top:20px;">Здесь пока пусто. Напишите первое сообщение!</div>';
                }
            } catch (e) {
                list.innerHTML = '<div class="db-error-alert">Не удалось загрузить сообщения. Ошибка сети.</div>';
                console.error(e);
            }
        }

        // Отрисовка сообщения на экране
        function renderMessage(msg) {
            const list = document.getElementById('messagesList');
            
            if (list.innerText.includes('Здесь пока пусто') || list.innerText.includes('Загрузка истории')) {
                list.innerHTML = '';
            }

            const msgEl = document.createElement('div');
            msgEl.className = 'message';
            
            const displayName = msg.profiles ? msg.profiles.display_name : (msg.display_name || 'Пользователь');
            const username = msg.username || 'unknown';
            const avatar = msg.profiles && msg.profiles.avatar_url ? msg.profiles.avatar_url : '';
            const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            msgEl.setAttribute('data-username', username.toLowerCase());
            msgEl.setAttribute('data-displayname', displayName.toLowerCase());
            
            let avatarHtml = avatar 
                ? `<div class="avatar" style="background-image: url(${avatar})"></div>`
                : `<div class="avatar" style="background-color: #383a40">${displayName.substring(0,2).toUpperCase()}</div>`;

            let mediaHtml = '';
            if(msg.media_url) {
                mediaHtml = msg.media_type === 'video'
                    ? `<video src="${msg.media_url}" controls class="media-attachment"></video>`
                    : `<img src="${msg.media_url}" class="media-attachment" />`;
            }

            msgEl.innerHTML = `
                ${avatarHtml}
                <div class="msg-body">
                    <div class="msg-meta">
                        <span class="msg-display-name">${escapeHtml(displayName)}</span>
                        <span class="msg-username">@${escapeHtml(username)}</span>
                        <span class="msg-time">${time}</span>
                    </div>
                    <div class="msg-content">${escapeHtml(msg.content || '')}</div>
                    ${mediaHtml}
                </div>
            `;
            list.appendChild(msgEl);
            list.scrollTop = list.scrollHeight;
        }

        // Фильтрация сообщений по никнейму
        function filterMessagesByNick() {
            const query = document.getElementById('searchNickInput').value.trim().toLowerCase().replace('@', '');
            const messages = document.querySelectorAll('.message');
            
            messages.forEach(msg => {
                const uTag = msg.getAttribute('data-username') || '';
                const dName = msg.getAttribute('data-displayname') || '';
                
                if (!query || uTag.includes(query) || dName.includes(query)) {
                    msg.style.display = 'flex';
                } else {
                    msg.style.display = 'none';
                }
            });
        }

        // Отправка текстового сообщения
        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if(!text || !currentChannelId) return;
            input.value = '';

            await supabase.from('messages').insert([{
                channel_id: currentChannelId,
                username: myUsername,
                content: text
            }]);
        }

        // Загрузка медиафайла в чат
        async function uploadMedia(element) {
            const file = element.files[0];
            if(!file || !currentChannelId) return;

            const fileExt = file.name.split('.').pop();
            const mediaType = file.type.startsWith('video') ? 'video' : 'image';
            const fileName = `chat_shared/${Date.now()}_${Math.floor(Math.random()*1000)}.${fileExt}`;

            const { error } = await supabase.storage.from('media').upload(fileName, file);
            if(error) return alert('Ошибка хранилища: ' + error.message);

            const { data } = supabase.storage.from('media').getPublicUrl(fileName);

            await supabase.from('messages').insert([{
                channel_id: currentChannelId,
                username: myUsername,
                content: '',
                media_url: data.publicUrl,
                media_type: mediaType
            }]);
            element.value = '';
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Realtime подписка на новые сообщения
        supabase
            .channel('messages-realtime')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async (payload) => {
                if(payload.new.channel_id === currentChannelId) {
                    try {
                        const { data } = await supabase.from('profiles').select('display_name, avatar_url').eq('username', payload.new.username).single();
                        payload.new.profiles = data;
                    } catch(e){}
                    renderMessage(payload.new);
                }
            })
            .subscribe();

        // Realtime отслеживание онлайна (Presence)
        let presenceChannel = null;
        function trackPresence() {
            if(presenceChannel) presenceChannel.unsubscribe();
            
            presenceChannel = supabase.channel('online_users');
            presenceChannel
                .on('presence', { event: 'sync' }, () => {
                    const state = presenceChannel.presenceState();
                    renderMembers(state);
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await presenceChannel.track({
                            username: myUsername,
                            display_name: myDisplayName,
                            avatar_url: myAvatarUrl
                        });
                    }
                });
        }

        // Отрисовка списка пользователей онлайн
        function renderMembers(state) {
            const container = document.getElementById('membersContainer');
            container.innerHTML = '';
            
            const usersMap = new Map();
            Object.values(state).forEach(presences => {
                presences.forEach(p => { if(p.username) usersMap.set(p.username, p); });
            });

            document.getElementById('onlineCount').innerText = usersMap.size;

            usersMap.forEach(user => {
                const row = document.createElement('div');
                row.className = 'mem-row';
                
                let avHtml = user.avatar_url
                    ? `<div class="avatar" style="background-image: url(${user.avatar_url})"><div class="status-online"></div></div>`
                    : `<div class="avatar" style="background-color: #5865f2">${(user.display_name || 'U').substring(0,2).toUpperCase()}<div class="status-online"></div></div>`;

                row.innerHTML = `
                    ${avHtml}
                    <div style="display: flex; flex-direction: column; overflow: hidden;">
                        <span style="font-size: 14px; font-weight: 600; color: #fff; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;">${escapeHtml(user.display_name || 'Аноним')}</span>
                        <span style="font-size: 12px; color: var(--text-muted); text-overflow: ellipsis; white-space: nowrap; overflow: hidden;">@${escapeHtml(user.username)}</span>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Точка старта приложения
        (() => {
            updateProfileUI(); 
            syncProfileWithDB();
            loadChannels();
            trackPresence();
        })();
    </script>
</body>
</html>
