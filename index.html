<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisClone Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-servers: #1e1f22;
            --bg-channels: #2b2d31;
            --bg-chat: #313338;
            --bg-members: #2b2d31;
            --bg-input: #383a40;
            --bg-profile: #232428;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --blurple: #5865f2;
            --green: #23a55a;
            --red: #da373c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-chat); color: var(--text-main); overflow: hidden; }

        /* 1. Панель Серверов (Самая левая) */
        .server-rail { width: 72px; background-color: var(--bg-servers); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; }
        .server-icon { width: 48px; height: 48px; background-color: #313338; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; cursor: pointer; transition: all 0.2s ease; font-size: 14px; }
        .server-icon:hover, .server-icon.active { border-radius: 30%; background-color: var(--blurple); }

        /* 2. Панель Каналов */
        .sidebar { width: 240px; background-color: var(--bg-channels); display: flex; flex-direction: column; }
        .server-name { height: 48px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; padding: 0 16px; font-weight: bold; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .channels-list { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
        .channel-btn { background: none; border: none; color: var(--text-muted); padding: 8px 12px; border-radius: 4px; text-align: left; cursor: pointer; font-weight: 500; font-size: 15px; display: flex; align-items: center; gap: 6px; }
        .channel-btn:hover { background: #35373c; color: var(--text-main); }
        .channel-btn.active { background: #404249; color: #fff; }

        /* Панель профиля внизу каналов */
        .user-profile-bar { height: 52px; background-color: var(--bg-profile); display: flex; align-items: center; padding: 0 8px; gap: 8px; border-top: 1px solid #1f2023; }
        .user-info { flex: 1; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; padding: 4px; border-radius: 4px; }
        .user-info:hover { background-color: #35373c; }
        .profile-name { font-weight: 600; color: #fff; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-status { font-size: 12px; color: var(--text-muted); }

        /* Аватарки */
        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; text-transform: uppercase; flex-shrink: 0; position: relative; }
        .avatar.large { width: 40px; height: 40px; font-size: 16px; }
        .status-dot { width: 10px; height: 10px; background-color: var(--green); border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid var(--bg-profile); }

        /* 3. Основная зона чата */
        .chat-container { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-chat); }
        .chat-header { height: 48px; border-bottom: 1px solid #1f2023; display: flex; align-items: center; padding: 0 16px; font-weight: bold; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); gap: 8px; }
        .messages-list { flex: 1; padding: 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        
        /* Сообщения в стиле Дискорда */
        .message { display: flex; gap: 16px; align-items: flex-start; }
        .message:hover { background-color: #2e3035; margin: 0 -16px; padding: 0 16px; }
        .msg-body { display: flex; flex-direction: column; }
        .msg-meta { display: flex; align-items: center; gap: 8px; }
        .msg-user { font-weight: 500; color: #f2f3f5; font-size: 15px; cursor: pointer; }
        .msg-user:hover { text-decoration: underline; }
        .msg-time { font-size: 12px; color: var(--text-muted); }
        .msg-content { color: #dbdee1; font-size: 15px; margin-top: 4px; word-break: break-word; line-height: 1.375; }

        /* Поле ввода */
        .input-area { padding: 0 16px 24px 16px; }
        .input-wrapper { background-color: var(--bg-input); border-radius: 8px; padding: 12px 16px; display: flex; }
        .input-wrapper input { background: none; border: none; color: var(--text-main); width: 100%; outline: none; font-size: 15px; }

        /* 4. Панель Участников (Справа) */
        .members-sidebar { width: 240px; background-color: var(--bg-members); display: flex; flex-direction: column; padding: 16px 8px; gap: 4px; }
        .members-group-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding-left: 8px; margin-bottom: 4px; }
        .member-row { display: flex; align-items: center; gap: 12px; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
        .member-row:hover { background-color: #35373c; }
        .member-name { font-size: 15px; font-weight: 500; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .member-row:hover .member-name { color: #fff; }

        /* Стилизация скроллбара */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2e3035; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #111214; }
    </style>
</head>
<body>

    <!-- 1. Панель Серверов -->
    <div class="server-rail">
        <div class="server-icon active" title="Главный Сервер">DC</div>
        <div class="server-icon" style="background-color: #35373c; color: var(--green);" onclick="alert('Кастомные сервера — в следующем обновлении!')">+</div>
    </div>

    <!-- 2. Боковая панель (Каналы и Профиль) -->
    <div class="sidebar">
        <div class="server-name">Мой Сервер</div>
        <div class="channels-list">
            <button class="channel-btn active"><span>#</span> общая-флудилка</button>
            <button class="channel-btn" onclick="alert('Голос настраивается!')"><span style="font-size: 18px; line-height: 0;">🔊</span> Голосовой канал</button>
        </div>
        
        <!-- Профиль юзера -->
        <div class="user-profile-bar">
            <div class="avatar" id="myAvatar">У</div>
            <div class="user-info" onclick="changeNickname()">
                <div class="profile-name" id="myProfileName">Загрузка...</div>
                <div class="profile-status"># в сети (клик для смены)</div>
            </div>
        </div>
    </div>

    <!-- 3. Основной Чат -->
    <div class="chat-container">
        <div class="chat-header"><span>#</span> общая-флудилка</div>
        <div class="messages-list" id="messagesList"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="msgInput" placeholder="Написать в #общая-флудилка" onkeydown="if(event.key === 'Enter') sendMessage()">
            </div>
        </div>
    </div>

    <!-- 4. Панель пользователей справа -->
    <div class="members-sidebar">
        <div class="members-group-title">В сети — <span id="onlineCount">0</span></div>
        <div id="membersListContainer"></div>
    </div>

    <script>
        // --- НАСТРОЙКА SUPABASE ---
        const SUPABASE_URL = 'ТВОЙ_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'ТВОЙ_SUPABASE_ANON_KEY';
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Хелпер генерации цвета на основе хэша никнейма (чтобы у каждого был свой постоянный цвет аватарки)
        function getAvatarColor(username) {
            const colors = ['#5865F2', '#57F287', '#FEE75C', '#EB459E', '#ED4245', '#1ABC9C', '#9B59B6', '#E67E22'];
            let hash = 0;
            for (let i = 0; i < username.length; i++) {
                hash = username.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        // Получаем или создаем имя юзера
        let myUsername = localStorage.getItem('chat_username') || 'Юзер_' + Math.floor(Math.random() * 1000);
        localStorage.setItem('chat_username', myUsername);

        const messagesList = document.getElementById('messagesList');
        const msgInput = document.getElementById('msgInput');
        const membersContainer = document.getElementById('membersListContainer');

        // Обновление отображения своего профиля
        function updateMyProfileUI() {
            document.getElementById('myProfileName').innerText = myUsername;
            const myAvatar = document.getElementById('myAvatar');
            myAvatar.innerText = myUsername.substring(0, 2);
            myAvatar.style.backgroundColor = getAvatarColor(myUsername);
            myAvatar.innerHTML += '<div class="status-dot"></div>';
        }

        // Смена никнейма по клику
        function changeNickname() {
            const newName = prompt('Введите новый никнейм:', myUsername);
            if (newName && newName.trim().length > 0) {
                myUsername = newName.trim().substring(0, 20);
                localStorage.setItem('chat_username', myUsername);
                updateMyProfileUI();
                // Переподключаем онлайн-статус с новым ником
                trackPresence();
            }
        }

        // 1. Загрузка старых сообщений
        async function loadHistory() {
            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(100);

            if (error) console.error('Ошибка загрузки истории:', error);
            else {
                messagesList.innerHTML = '';
                data.forEach(appendMessage);
            }
        }

        // 2. Отправка сообщения
        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            msgInput.value = '';

            const { error } = await supabase
                .from('messages')
                .insert([{ username: myUsername, content: text }]);

            if (error) console.error('Ошибка отправки:', error);
        }

        // 3. Рендер сообщения на экране (Красивый Дискорд-стайл)
        function appendMessage(msg) {
            const msgEl = document.createElement('div');
            msgEl.className = 'message';
            
            const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const userColor = getAvatarColor(msg.username);
            const initials = msg.username.substring(0,2);

            msgEl.innerHTML = `
                <div class="avatar large" style="background-color: ${userColor}">${escapeHtml(initials)}</div>
                <div class="msg-body">
                    <div class="msg-meta">
                        <span class="msg-user" style="color: #fff">${escapeHtml(msg.username)}</span>
                        <span class="msg-time">${time}</span>
                    </div>
                    <div class="msg-content">${escapeHtml(msg.content)}</div>
                </div>
            `;
            messagesList.appendChild(msgEl);
            messagesList.scrollTop = messagesList.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // 4. РЕАЛТАЙМ: Слушаем новые сообщения
        supabase
            .channel('schema-db-changes')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                appendMessage(payload.new);
            })
            .subscribe();


        // 5. ТРЕКИНГ ОНЛАЙНА (Supabase Presence)
        let presenceChannel = supabase.channel('online_room');

        function trackPresence() {
            presenceChannel.unsubscribe(); // Сбрасываем старый, если меняли ник
            
            presenceChannel = supabase.channel('online_room');
            
            presenceChannel
                .on('presence', { event: 'sync' }, () => {
                    const state = presenceChannel.presenceState();
                    renderOnlineUsers(state);
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await presenceChannel.track({
                            username: myUsername,
                            onlineAt: new Date().toISOString()
                        });
                    }
                });
        }

        // Отрисовка списка юзеров в сети справа
        function renderOnlineUsers(presenceState) {
            membersContainer.innerHTML = '';
            const uniqueUsers = new Set();

            // Собираем всех уникальных юзеров из стейта вебсокета
            Object.values(presenceState).forEach(presences => {
                presences.forEach(p => {
                    uniqueUsers.add(p.username);
                });
            });

            document.getElementById('onlineCount').innerText = uniqueUsers.size;

            uniqueUsers.forEach(user => {
                const userColor = getAvatarColor(user);
                const initials = user.substring(0, 2);

                const row = document.createElement('div');
                row.className = 'member-row';
                row.innerHTML = `
                    <div class="avatar" style="background-color: ${userColor}">
                        ${escapeHtml(initials)}
                        <div class="status-dot"></div>
                    </div>
                    <div class="member-name">${escapeHtml(user)}</div>
                `;
                membersContainer.appendChild(row);
            });
        }

        // СТАРТ ПРИЛОЖЕНИЯ
        updateMyProfileUI();
        loadHistory();
        trackPresence();
    </script>
</body>
</html>
